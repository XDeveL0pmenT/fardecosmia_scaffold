{% extends "characters/personal_notes_base.html" %}
{% block thought_content %}
<main class="held-thought-focus held-thought-focus--detail" aria-label="Открытая мысль" data-memory-focus-state="detail">
    <article class="held-thought held-thought--focused reflection-node" data-reflection-node data-memory-focused-thought tabindex="-1">
        <span class="held-thought__spark" aria-hidden="true">✦</span>
        {% if note.memo %}<h2 class="held-thought__memo">{{ note.memo }}</h2>{% endif %}
        <div class="held-thought__body held-thought__body--full">{{ note.body|linebreaksbr }}</div>
    </article>
    <div class="held-thought-focus__actions">
        <a class="memory-action" href="{% url 'characters:personal_note_return' campaign.id note.id %}" data-character-transition>Вернуться к мысли</a>
        <a class="memory-action memory-action--release" href="{% url 'characters:personal_note_release' campaign.id note.id %}" data-character-transition>Отпустить</a>
        <a class="memory-action memory-action--quiet" href="{% url 'characters:personal_note_list' campaign.id %}" data-character-transition data-memory-close>К остальным мыслям</a>
    </div>
</main>
{% endblock %}
