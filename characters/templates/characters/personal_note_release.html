{% extends "characters/personal_notes_base.html" %}
{% block thought_content %}
<main class="held-thought-focus held-thought-focus--release" data-memory-focus-state="release">
    <article class="held-thought held-thought--focused held-thought--release-focus reflection-node" data-reflection-node data-memory-focused-thought>
        <span class="held-thought__spark" aria-hidden="true">✦</span>
        {% if note.memo %}<h2 class="held-thought__memo">{{ note.memo }}</h2>{% endif %}
        <div class="held-thought__body held-thought__body--full">{{ note.body|linebreaksbr }}</div>
    </article>
    <section class="held-thought-release" role="alertdialog" aria-labelledby="release-thought-title" aria-describedby="release-thought-copy">
        <span aria-hidden="true">· ✦ ·</span>
        <h2 id="release-thought-title">Отпустить эту мысль?</h2>
        <p id="release-thought-copy">Она больше не останется среди удержанных мыслей.</p>
        <form method="post" data-memory-release-form>
            {% csrf_token %}
            <a class="memory-action memory-action--quiet" href="{% url 'characters:personal_note_detail' campaign.id note.id %}" data-character-transition data-memory-close>Оставить</a>
            <button class="memory-action memory-action--release" type="submit">Отпустить</button>
        </form>
    </section>
</main>
{% endblock %}
