<a class="held-thought reflection-node" href="{% url 'characters:personal_note_detail' campaign.id note.id %}" aria-label="Открыть удержанную мысль" data-reflection-node data-memory-thought data-character-transition>
    <span class="held-thought__spark" aria-hidden="true">✦</span>
    {% if note.memo %}<strong class="held-thought__memo">{{ note.memo }}</strong>{% endif %}
    <span class="held-thought__body">{{ note.body|truncatechars:320|linebreaksbr }}</span>
</a>
