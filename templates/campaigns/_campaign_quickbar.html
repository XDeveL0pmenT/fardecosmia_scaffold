<nav class="campaign-quickbar" aria-label="Быстрый доступ кампании">
    <div class="campaign-quickbar__inner">
        <div class="campaign-quickbar__links">
            <span class="campaign-quickbar__name">{{ campaign.name }}</span>
            <a href="{% url 'campaigns:gm_dashboard' campaign.id %}">Панель</a>
            <a href="{% url 'campaigns:campaign_detail' campaign.id %}">О кампании</a>
            <a href="{% url 'campaigns:members' campaign.id %}">Участники</a>
            <a href="{% url 'characters:gm_list' campaign.id %}">Персонажи</a>
            <a href="{% url 'world:world_map' campaign.id %}">Регионы кампании</a>
            <a href="{% url 'world:campaign_world_entry_list' campaign.id %}">Канон кампании</a>
            <a href="{% url 'world:campaign_approval_queue' campaign.id %}">Запросы</a>
            <a href="{% url 'world:campaign_event_list' campaign.id %}">События мира</a>
            <a href="{% url 'world:my_approval_requests' campaign.id %}">Мои запросы</a>
            <a href="{% url 'world:campaign_audit_list' campaign.id %}">История</a>
        </div>
        <form class="quick-time-control" method="post" action="{% url 'campaigns:advance_time' campaign.id %}" data-time-control>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            <label>
                <span class="sr-only">Единица времени</span>
                <select name="unit" data-time-unit>
                    {% for unit in time_advance_units %}
                        <option value="{{ unit.value }}" data-max="{{ unit.max }}" data-default="{{ unit.default }}" data-help="{{ unit.help }}">{{ unit.label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="quick-time-control__range">
                <span class="sr-only">Количество</span>
                <input name="amount" type="range" min="1" max="180" value="10" data-time-amount>
            </label>
            <output data-time-output>10 минут</output>
            <span class="quick-time-control__canon" data-time-help aria-live="polite" hidden></span>
            <button type="submit">Продвинуть</button>
        </form>
    </div>
</nav>
